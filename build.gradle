plugins {
    id 'java'
    id 'application'
}

group 'com.game'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // MySQL Connector dependency ktang
    //implementation files('C:/Users/ktang/OneDrive/Desktop/Testing Connection/Group6SD/mysql-connector-j-9.2.0.jar')
    //MySQL Connector Dependency Jathan
    implementation files ('/Users/jathanneider/Desktop/StreetFighterStickFigures/mysql-connector-j-9.2.0.jar')
    // OCSF dependency – place your OCSF jar in the libs folder ktang
    //implementation files('C:/Users/ktang/OneDrive/Desktop/Testing Connection/Group6SD/ocsf.jar')
    //OCSF Dependency Jathan
    implementation files ('/Users/jathanneider/Desktop/StreetFighterStickFigures/ocsf.jar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    
}

// The default 'run' task uses HostLauncher, for example
application {
    mainClass = 'com.game.launcher.HostLauncher'
}

task runHost(type: JavaExec) {
    group = 'application'
    description = 'Run the game in host mode (server + client).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.game.launcher.HostLauncher'
}

task runClient(type: JavaExec) {
    group = 'application'
    description = 'Run the game in client-only mode.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.game.launcher.ClientLauncher'
}